<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão Tranquila — Matemática 5º Ano 🌿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#f2f7f4; --cartao:#ffffff; --texto:#2f4858;
    --verde:#7fb89a; --verdeesc:#4e8a6c; --azul:#8fb8d8; --azulesc:#4a7fa5;
    --areia:#f5edda; --destaque:#e9f3ec;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Lexend', Verdana, Arial, sans-serif;
    background:var(--fundo); color:var(--texto); min-height:100vh;
    display:flex; flex-direction:column;
  }
  .topo{
    text-align:center; padding:16px 12px 10px; background:var(--cartao);
    border-bottom:4px solid var(--verde);
  }
  .topo h1{font-size:1.25em; font-weight:700;}
  .progresso{max-width:680px; margin:10px auto 0; display:flex; align-items:center; gap:10px; padding:0 16px;}
  .barraFundo{flex:1; height:14px; background:#e2ebe5; border-radius:8px; overflow:hidden;}
  .barraFrente{height:100%; width:0%; background:var(--verde); border-radius:8px; transition:.5s;}
  .contador{font-size:.95em; white-space:nowrap;}
  .palco{
    flex:1; display:flex; align-items:center; justify-content:center; padding:20px 14px 10px;
  }
  .tela{
    background:var(--cartao); border-radius:24px; padding:38px 30px;
    max-width:680px; width:100%; min-height:380px;
    box-shadow:0 6px 20px #0001; text-align:center;
    display:flex; flex-direction:column; justify-content:center; gap:22px;
    animation:chegar .45s ease;
  }
  @keyframes chegar{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  .tela .emoji{font-size:3em;}
  .tela h2{font-size:1.7em; line-height:1.4; font-weight:700;}
  .tela p{font-size:1.35em; line-height:1.9;}
  .tela .grande{font-size:2.1em; font-weight:700; color:var(--verdeesc);}
  .quadro{
    background:var(--destaque); border-radius:16px; padding:20px 22px;
    font-size:1.3em; line-height:2;
  }
  .pausa{background:var(--areia);}
  .frac{display:inline-block; text-align:center; vertical-align:middle; margin:0 4px; font-weight:700;}
  .frac span{display:block; padding:0 8px;}
  .frac span:first-child{border-bottom:3px solid currentColor;}
  .botoes{
    display:flex; justify-content:center; gap:16px; padding:14px 14px 26px;
  }
  .btn{
    border:none; border-radius:18px; padding:16px 34px; font-size:1.2em; font-weight:700;
    cursor:pointer; font-family:inherit; transition:.15s;
  }
  .btn:hover{transform:scale(1.04);}
  .btnVoltar{background:#dde7e0; color:var(--texto);}
  .btnAvancar{background:var(--verdeesc); color:#fff;}
  .btn:disabled{opacity:.35; cursor:default; transform:none;}
  .colinha{text-align:left; font-size:1.12em; line-height:2.1;}
  .colinha b{color:var(--verdeesc);}
  @media (max-width:600px){
    .tela{padding:28px 18px; min-height:340px;}
    .tela p{font-size:1.2em;}
    .tela h2{font-size:1.45em;}
  }
</style>
</head>
<body>

<div class="topo">
  <h1>🌿 Revisão Tranquila — Frações e Decimais</h1>
  <div class="progresso">
    <div class="barraFundo"><div class="barraFrente" id="barra"></div></div>
    <span class="contador" id="contador"></span>
  </div>
</div>

<div class="palco">
  <div class="tela" id="tela"></div>
</div>

<div class="botoes">
  <button class="btn btnVoltar" id="btnVoltar" onclick="mudar(-1)">⬅ Voltar</button>
  <button class="btn btnAvancar" id="btnAvancar" onclick="mudar(1)">Avançar ➡</button>
</div>

<script>
var TELAS = [
 {emoji:'🌿', h:'Oi! Que bom ter você aqui.',
  p:'Esta revisão é no <b>seu ritmo</b>.<br>Uma ideia de cada vez.<br>Sem pressa. Sem pegadinha.'},

 {emoji:'🍕', h:'O que é uma fração?',
  p:'É um pedaço de um inteiro.<br><span class="grande"><span class="frac"><span>1</span><span>2</span></span></span><br>Uma pizza dividida em 2 partes.<br>Pegamos 1 parte: <b>metade</b>.'},

 {emoji:'🔢', h:'Os dois números da fração',
  p:'<b>Em cima</b> → numerador<br>= quantas partes pegamos.<br><br><b>Embaixo</b> → denominador<br>= em quantas partes dividimos.'},

 {emoji:'🧮', h:'Fração de uma quantidade',
  p:'A regra é uma só:<br><br><b>Divide pelo de baixo.</b><br><b>Multiplica pelo de cima.</b>'},

 {emoji:'🍫', h:'Vamos ver na prática?',
  p:'<span class="frac"><span>1</span><span>3</span></span> de 12 bombons<br><br>12 ÷ 3 = <span class="grande">4</span><br>Pronto. 4 bombons!'},

 {emoji:'🍬', h:'Mais um, devagarinho',
  p:'<span class="frac"><span>2</span><span>5</span></span> de 20 balas<br><br>20 ÷ 5 = 4<br>4 × 2 = <span class="grande">8</span> balas'},

 {emoji:'🫁', tipo:'pausa', h:'Pausa para respirar',
  p:'Feche os olhos.<br>Respire fundo 3 vezes.<br>Beba uma aguinha. 💧<br><br>Quando quiser, toque em Avançar.'},

 {emoji:'😊', h:'Fração própria',
  p:'O de cima é <b>menor</b> que o de baixo.<br><span class="grande"><span class="frac"><span>3</span><span>8</span></span></span><br>Vale <b>menos</b> que 1 inteiro.'},

 {emoji:'😮', h:'Fração imprópria',
  p:'O de cima é <b>maior ou igual</b>.<br><span class="grande"><span class="frac"><span>5</span><span>3</span></span></span><br>Vale <b>1 inteiro ou mais</b>.'},

 {emoji:'🎩', h:'Fração aparente',
  p:'A divisão dá um número <b>exato</b>.<br><span class="grande"><span class="frac"><span>8</span><span>4</span></span> = 2</span><br>Ela "se disfarça" de fração,<br>mas é um número inteiro!'},

 {emoji:'🍰', h:'Número misto',
  p:'Inteiro + fração, juntos.<br><span class="grande">1 <span class="frac"><span>1</span><span>2</span></span></span><br>Lemos: <b>"um e meio"</b>.<br>Uma torta inteira e mais metade.'},

 {emoji:'🫁', tipo:'pausa', h:'Outra pausa, você merece',
  p:'Estique os braços bem alto. 🙆<br>Conte até 10 devagar.<br><br>Você já aprendeu muito!'},

 {emoji:'👯', h:'Frações equivalentes',
  p:'Frações <b>diferentes</b> que valem o <b>mesmo</b>.<br><span class="grande"><span class="frac"><span>1</span><span>2</span></span> = <span class="frac"><span>2</span><span>4</span></span> = <span class="frac"><span>4</span><span>8</span></span></span><br>Todas são metade!'},

 {emoji:'✖️', h:'Como criar uma equivalente',
  p:'Multiplique (ou divida)<br><b>os dois números</b> pelo mesmo valor.<br><br><span class="frac"><span>3</span><span>5</span></span> ×2 em cima e embaixo → <span class="frac"><span>6</span><span>10</span></span>'},

 {emoji:'✂️', h:'Simplificar',
  p:'É deixar a fração mais magrinha:<br>divida os dois pelo mesmo número.<br><br><span class="frac"><span>4</span><span>8</span></span> → <span class="frac"><span>2</span><span>4</span></span> → <span class="grande"><span class="frac"><span>1</span><span>2</span></span></span><br>Quando não dá mais: <b>irredutível</b>.'},

 {emoji:'⚖️', h:'Comparar: embaixo igual',
  p:'Denominadores iguais?<br>Ganha quem tem <b>mais em cima</b>.<br><br><span class="grande"><span class="frac"><span>3</span><span>5</span></span> &gt; <span class="frac"><span>2</span><span>5</span></span></span>'},

 {emoji:'🍕', h:'Comparar: em cima igual',
  p:'Numeradores iguais?<br>Ganha o <b>menor</b> denominador.<br>(pedaços maiores!)<br><span class="grande"><span class="frac"><span>1</span><span>4</span></span> &gt; <span class="frac"><span>1</span><span>5</span></span></span>'},

 {emoji:'🫁', tipo:'pausa', h:'Pausa do meio do caminho',
  p:'Metade já foi! 🎉<br>Levante e dê uma voltinha.<br>Volte quando estiver pronta.'},

 {emoji:'💧', h:'Números decimais',
  p:'São os números <b>com vírgula</b>.<br><span class="grande">53<b>,</b>6</span><br>Antes da vírgula: <b>parte inteira</b>.<br>Depois: <b>parte decimal</b>.'},

 {emoji:'🔟', h:'O décimo',
  p:'1 inteiro dividido em <b>10</b> partes.<br><span class="grande">0,1 = <span class="frac"><span>1</span><span>10</span></span></span><br>Uma casa depois da vírgula.'},

 {emoji:'💯', h:'O centésimo e o milésimo',
  p:'<b>0,01</b> = 1 de 100 (duas casas)<br><b>0,001</b> = 1 de 1.000 (três casas)<br><br>Quanto mais casas, menor o pedacinho!'},

 {emoji:'🗣️', h:'Como ler um decimal',
  p:'<b>5,8</b> → cinco inteiros e oito <b>décimos</b><br><b>5,08</b> → cinco inteiros e oito <b>centésimos</b><br><b>5,008</b> → cinco inteiros e oito <b>milésimos</b>'},

 {emoji:'🏆', h:'Comparar decimais',
  p:'1º: olhe a <b>parte inteira</b>.<br>76 &lt; 80? Então 76,9 &lt; 80,1.<br><br>Empatou? Iguale as casas com zero:<br>46,9 vira 46,9<b>0</b> → 46,90 &gt; 46,09'},

 {emoji:'0️⃣', h:'O zero do final não muda nada',
  p:'<span class="grande">0,5 = 0,50 = 0,500</span><br>Zero <b>à direita</b> do decimal: tudo igual.<br><br>Mas cuidado: 0,5 ≠ 0,05!'},

 {emoji:'🫁', tipo:'pausa', h:'Última pausa',
  p:'Respire fundo.<br>Sorria: falta pouquinho. 😊'},

 {emoji:'📌', h:'Cola mental — leve no coração', tipo:'cola',
  p:'<div class="colinha">'+
    '✅ Fração de quantidade: <b>divide pelo de baixo, multiplica pelo de cima</b>.<br>'+
    '✅ <b>Própria</b>: cima menor • <b>Imprópria</b>: cima maior • <b>Aparente</b>: divisão exata.<br>'+
    '✅ Equivalentes: <b>mesmo valor</b> (×ou÷ os dois números).<br>'+
    '✅ Embaixo igual → ganha o maior de cima.<br>'+
    '✅ Em cima igual → ganha o menor de baixo.<br>'+
    '✅ 1 casa = décimos • 2 = centésimos • 3 = milésimos.<br>'+
    '✅ Comparar decimal: parte inteira primeiro, depois iguale com zeros.<br>'+
    '✅ 0,5 = 0,50 = metade.</div>'},

 {emoji:'🌟', h:'Você chegou ao fim!',
  p:'Que orgulho de você. 💚<br>Revisou tudo, no seu ritmo.<br><br>Boa prova na sexta!<br>Você está pronta. 🍀'}
];

var atual = 0;

function mostrar(){
  var t = TELAS[atual];
  var tela = document.getElementById('tela');
  tela.className = 'tela' + (t.tipo==='pausa' ? ' pausa' : '');
  var corpo = (t.tipo==='cola') ? '<div class="quadro">'+t.p+'</div>' : '<p>'+t.p+'</p>';
  tela.innerHTML = '<div class="emoji">'+t.emoji+'</div><h2>'+t.h+'</h2>'+corpo;
  document.getElementById('barra').style.width = Math.round(100*(atual+1)/TELAS.length)+'%';
  document.getElementById('contador').textContent = (atual+1)+' de '+TELAS.length;
  document.getElementById('btnVoltar').disabled = (atual===0);
  document.getElementById('btnAvancar').disabled = (atual===TELAS.length-1);
}

function mudar(passo){
  var novo = atual + passo;
  if(novo>=0 && novo<TELAS.length){
    atual = novo;
    mostrar();
  }
}

document.addEventListener('keydown', function(ev){
  if(ev.key==='ArrowRight'){ mudar(1); }
  if(ev.key==='ArrowLeft'){ mudar(-1); }
});

mostrar();
</script>
</body>
</html>
